[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headasresonator3"
version = "0.1.0"
description = "Complex-phase audio/electrode impulse and false-attribution audit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
eeg = ["mne>=1.5", "soundfile>=0.12"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["resonator3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
