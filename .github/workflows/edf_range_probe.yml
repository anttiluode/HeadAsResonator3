name: Test partial public EDF access (metadata-only range)

on:
  push:
    paths:
      - 'scripts/edf_range_probe.py'
      - '.github/workflows/edf_range_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch first 8 KiB of one published NEMAR EDF
        run: python scripts/edf_range_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edf-header-probe
          path: results/edf_range_probe.json
