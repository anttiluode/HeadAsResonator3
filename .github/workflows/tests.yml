name: Physical-path identification kill tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  synthetic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and tests
        run: python -m pip install -e ".[dev]"
      - name: Run synthetic falsification tests
        run: python -m pytest -q
      - name: Run complete synthetic multichannel report
        run: python -m resonator3.cli --demo --out results/synthetic_demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-phase-and-lag-audit
          path: results/synthetic_demo/
          if-no-files-found: warn
