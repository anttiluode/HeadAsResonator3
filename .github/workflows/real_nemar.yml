name: Real high-rate NEMAR same-clock microphone/EEG audit

on:
  push:
    paths:
      - 'scripts/real_nemar_excerpt.py'
      - '.github/workflows/real_nemar.yml'
  workflow_dispatch:

jobs:
  real-public-excerpt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[eeg,dev]"
      - name: Download 35 seconds from exact original sub-03 run-02 (byte ranges only)
        run: >
          python scripts/real_nemar_excerpt.py
          --which original --start 0 --duration 35 --out results/real_original_sub03
      - name: Publish derived summaries only, never raw EDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sub03-phase-lag-audit
          path: results/real_original_sub03/
          if-no-files-found: warn
