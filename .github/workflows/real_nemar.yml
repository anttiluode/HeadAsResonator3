name: Real high-rate NEMAR same-clock microphone/EEG audit

on:
  push:
    paths:
      - 'scripts/real_nemar_excerpt.py'
      - '.github/workflows/real_nemar.yml'
  workflow_dispatch:

jobs:
  real-public-excerpt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[eeg,dev]"
      - name: Download ONLY first 40 selected 1-second data records (about 13 MB)
        run: >
          python scripts/real_nemar_excerpt.py
          --start 60 --duration 40 --out results/real_nemar_001
      - name: Publish derived summaries only, never raw EDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-nemar-phase-lag-audit
          path: results/real_nemar_001/
          if-no-files-found: warn
