name: Gate 003 - Cross-subject real 1200Hz speech EEG

on:
  push:
    paths:
      - 'scripts/choose_cross_subject_runs.py'
      - 'scripts/real_gate_003.py'
      - 'tests/test_cross_subject_selection.py'
      - 'tests/test_real_gate_003.py'
      - '.github/workflows/real_gate_003.yml'
  workflow_dispatch:

jobs:
  independent-participants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: python -m pip install -e ".[eeg,dev]"
      - name: Check synthetic and metadata-only selection controls
        run: python -m pytest -q
      - name: Analyze metadata-selected subjects without retuning
        run: python -m scripts.real_gate_003 --fresh 8 --out results/real_gate_003
      - name: Upload derived results and metadata, not raw EDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gate003-cross-participant-results
          path: results/real_gate_003/
          if-no-files-found: warn
